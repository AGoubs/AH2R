      <div class="main-content">
        <div id="videos" class="title">Vidéos</div>
        <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
          <!-- Indicateurs -->
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"
              aria-current="true"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
          </div>

          <!-- Contenu du carousel -->
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="https://workik-widget-assets.s3.amazonaws.com/widget-assets/images/PP5.4.svg"
                class="d-block w-100" alt="Image 1">
              <div class="carousel-caption d-none d-md-block">
                <h5>Slide 1</h5>
                <p>Description de l'image 1.</p>
              </div>
            </div>
            <div class="carousel-item">
              <img src="https://workik-widget-assets.s3.amazonaws.com/widget-assets/images/PP5.5.svg"
                class="d-block w-100" alt="Image 2">
              <div class="carousel-caption d-none d-md-block">
                <h5>Slide 2</h5>
                <p>Description de l'image 2.</p>
              </div>
            </div>
            <div class="carousel-item">
              <img src="https://workik-widget-assets.s3.amazonaws.com/widget-assets/images/PP5.6.svg"
                class="d-block w-100" alt="Image 3">
              <div class="carousel-caption d-none d-md-block">
                <h5>Slide 3</h5>
                <p>Description de l'image 3.</p>
              </div>
            </div>
          </div>

          <!-- Contrôles précédent et suivant -->
          <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Précédent</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Suivant</span>
          </button>
        </div>
